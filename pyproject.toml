# pyproject.toml

[tool.poetry]
name = "llm-engineers-handbook-final"
version = "0.1.0"
description = "Document lifecycle and LLM engineering pipeline"
authors = ["Anthony <anthony@example.com>"]
#readme = "README.md"
#packages = [{ include = "llm_engineers_handbook_final" }]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
torch = "2.2.2"
click = "8.0.1"
loguru = "0.7.3"
pdfminer-six = "20251107"
pytesseract = "0.3.13"
pypdfium2 = "5.1.0"
Pillow = "12.0.0"
#zenml = "0.74.0"
zenml = { version = "0.74.0", extras = ["server"] }
pydantic = "2.8"
#numpy = "2.3.5"
numpy = "^1.26.4"
pymongo = "4.15.5"
qdrant-client = "1.8.0"
transformers = "^4.57.3"
datasets = "^3.0.1"

#feature engineering
sentence-transformers = "^3.0.0"


[tool.poetry.group.aws.dependencies]
sagemaker = ">=2.232.2"
s3fs = ">2022.3.0"
aws-profile-manager = "^0.7.3"
kubernetes = "^30.1.0"
sagemaker-huggingface-inference-toolkit = "^2.4.0"


# RAG
langchain-openai = "^0.1.3"
langchain-community = "^0.2.11"
langchain-ollama = "^0.1.3"
langchain = "^0.2.16"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
