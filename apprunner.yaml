version: 1.0
runtime: python311
build:
  commands:
    pre-build:
      - echo "Starting pre-build..."
      - pip install --upgrade pip setuptools wheel
    build:
      - echo "Installing requirements..."
      - pip install -r requirements.txt --no-cache-dir
      - echo "Build complete!"
run:
  command: python app.py
  network:
    port: 8080
    env: PORT
  env:
    - name: PYTHONPATH
      value: "."
