name: Build and Push Web App to ECR

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/docker-ecr.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::317006682615:role/github-actions-ecr
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: web
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/nigeria-tax-chatbot:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/nigeria-tax-chatbot:latest \
            .

          docker push ${{ steps.login-ecr.outputs.registry }}/nigeria-tax-chatbot:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/nigeria-tax-chatbot:latest